version: '3.8'

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: henrycook-webserver
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    expose:
      - "80"
    labels:
      caddy: henrycook.net, www.henrycook.net
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - proxy

networks:
  proxy:
    external: true
